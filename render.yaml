# Render Blueprint for the OpenJarvis FastAPI server.
# Deploys src/openjarvis/server/app.py via deploy/docker/Dockerfile.
# Apply at: https://dashboard.render.com/blueprint/new?repo=<your-fork-url>
#
# This blueprint is pinned to Ollama's hosted Cloud API (https://ollama.com)
# running gpt-oss:120b, instead of OpenAI. It needs an Ollama API key
# (https://ollama.com/settings/keys) — the model itself runs on Ollama's
# servers, not on this Render instance, so the free plan's lack of GPU is not
# a problem. Voice input (speech-to-text) uses Groq's hosted Whisper API and
# needs a separate Groq API key (https://console.groq.com/keys).
services:
  - type: web
    name: openjarvis-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # Override the Dockerfile CMD while preserving its `jarvis` entrypoint.
    # Render's default web-service port is 10000. Pin PORT and the CLI argument
    # to that same value because Docker commands do not interpolate `$PORT`.
    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine ollama --model gpt-oss:120b
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Keep Render's expected public port aligned with the fixed Docker
      # command above. Change both values together when customizing the port.
      - key: PORT
        value: "10000"

      # Auth for the OpenJarvis API itself. Required because the server refuses
      # to bind to a non-loopback host without an API key (check_bind_safety).
      - key: OPENJARVIS_API_KEY
        generateValue: true

      # Points the "ollama" engine at Ollama's hosted Cloud API instead of a
      # local `ollama serve` (which does not exist on this container).
      - key: OLLAMA_HOST
        value: https://ollama.com

      # Bearer token for the above. Get one at https://ollama.com/settings/keys.
      - key: OLLAMA_API_KEY
        sync: false

      # Powers voice input (browser mic -> /v1/speech/transcribe -> Groq
      # Whisper). Get one at https://console.groq.com/keys. Optional: leave
      # unset and the mic button stays disabled with a "not configured" tooltip.
      - key: GROQ_API_KEY
        sync: false

      # The free service filesystem is ephemeral. OpenJarvis state under this
      # directory is lost on every restart, spin-down, or deploy. See
      # docs/deployment/render.md before storing credentials or durable state.
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
