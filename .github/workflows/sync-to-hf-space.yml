name: Sync to Hugging Face Space

# Mirrors every push to main into the Hugging Face Space repo, so the Space
# always reflects what's actually on GitHub — see docs/deployment/huggingface.md.
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   HF_TOKEN       a Hugging Face access token with write access to the Space
#   HF_SPACE_REPO  e.g. "your-username/your-space-name"
# Without both secrets set, this workflow is a no-op (skipped, not failed).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.HF_TOKEN }}" ] && [ -n "${{ secrets.HF_SPACE_REPO }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN and/or HF_SPACE_REPO secrets not set — skipping Space sync. See docs/deployment/huggingface.md."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to the Space
        if: steps.check.outputs.configured == 'true'
        run: |
          git remote add space "https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_SPACE_REPO }}"
          git push --force space HEAD:main
